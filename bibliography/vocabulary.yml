  - id: love
    label: Love
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [charity, caritas, disinterested love]
    note: The capacity to love as a criterion of dignity, and its impairment as a harm.

  - id: agency
    label: Agency
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [self-efficacy, free will, freedom of choice]
    note: The capacity to act and choose; what treatment aims to restore.

  - id: responsibility
    label: Responsibility
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [accountability, personal and societal responsibility]
