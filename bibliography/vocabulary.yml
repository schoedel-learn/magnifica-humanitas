    aliases: [historical]
    note: A history-of-ideas treatment of a concept.

  # ---- batch 2: concepts the addiction/dignity essay introduces --------------
  - id: addiction
    label: Addiction
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [substance use disorder, substance abuse, substance dependence, addictive]
    note: Impaired use of a substance or behaviour, argued here to be a dignity disorder.

  - id: dignity-disorder
    label: Dignity disorder
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: []
