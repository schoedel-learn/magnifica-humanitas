    axis: concept
    status: approved
    origin: from-title
    aliases: [dignity]
    note: >-
      Added by Barry's decision on 2026-10-12. The subject of the seed article and of three
      works in the seed list; without it the index could not answer its own question.

  - id: medicine-health-care-and-philosophy
    label: Medicine, Health Care and Philosophy
    axis: venue
    status: approved
    origin: from-title
    aliases: []
    note: The seed article's venue.

  - id: european-journal-of-international-law
    label: European Journal of International Law
    axis: venue
    status: approved
    origin: from-title
    aliases: [EJIL]

  - id: the-linacre-quarterly
    label: The Linacre Quarterly
    axis: venue
    status: approved
    origin: from-title
    aliases: [Linacre Q]
    note: Journal of the Catholic Medical Association; the venue of the addiction-and-dignity essay.

  # ---- proposed by an agent, awaiting Barry's decision (agent-proposed) -------
  - id: autonomy
    label: Autonomy
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [self-determination]
    note: The rival grounding the seed article rejects — dignity as self-rule.

  - id: bare-life
    label: Bare life
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [bare life, nuda vita]

  - id: sovereignty
    label: Sovereignty
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [sovereign power]

  - id: dependence
    label: Dependence
    axis: concept
    status: proposed
    origin: agent-proposed
    aliases: [dependency]
